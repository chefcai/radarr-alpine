name: Build and Push radarr-alpine Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional suffix appended to the version tag (e.g. "iter2-debian"). When set, :latest is NOT updated.'
        type: string
        required: false
        default: ''
      measure_baseline:
        description: 'Skip the build, just measure lscr.io/linuxserver/radarr:latest baseline.'
        type: boolean
        required: false
        default: false
  schedule:
    # Daily at 07:15 UTC. Staggered after bazarr-alpine (06:00),
    # jellyfin-alpine (06:15), ttyd-alpine (06:30), seerr-alpine (06:45),
    # sonarr-alpine (07:00).
    # Skips automatically if the latest Radarr master version already has an
    # image published — see "Check if image already exists".
    - cron: '15 7 * * *'
    # Weekly periodic base refresh, Sundays at 08:15 UTC. Forces a rebuild
    # even when the current Radarr version is already published, so Alpine
    # base-image and apk security patches land on a cadence instead of only
    # when Radarr itself releases (see cross-cutting CI finding #2).
    - cron: '15 8 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Serialize runs on this ref. If a second run is queued while one is in-flight,
# the older still-running job gets cancelled. Prevents the parallel-push :latest
# race documented in feedback_gha_parallel_push_race.md.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Measure upstream linuxserver/radarr:latest (iter-0 baseline)
    if: github.event_name == 'workflow_dispatch' && inputs.measure_baseline
    runs-on: ubuntu-latest
    steps:
      - name: Pull manifest and report compressed size for lscr.io/linuxserver/radarr:latest
        run: |
          PKG="linuxserver/radarr"
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${PKG}:pull" | jq -r .token)
          INDEX=$(curl -sSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/${PKG}/manifests/latest")
          AMD64_DIGEST=$(echo "$INDEX" | jq -r '.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest' | head -1)
          if [ -z "$AMD64_DIGEST" ] || [ "$AMD64_DIGEST" = "null" ]; then
            MANIFEST="$INDEX"
          else
            MANIFEST=$(curl -sSL \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${PKG}/manifests/${AMD64_DIGEST}")
          fi
          COMPRESSED=$(echo "$MANIFEST" | jq '[.layers[].size] | add')
          COMPRESSED_MB=$(echo "scale=1; $COMPRESSED / 1024 / 1024" | bc)
          LAYERS=$(echo "$MANIFEST" | jq '.layers | length')
          echo "::notice::lscr.io/linuxserver/radarr:latest (linux/amd64) compressed = ${COMPRESSED_MB} MB across ${LAYERS} layers"
          echo "## iter-0 baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`lscr.io/linuxserver/radarr:latest\` (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compressed size: **${COMPRESSED_MB} MB** across ${LAYERS} layers" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifest digest: \`${AMD64_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Layer breakdown" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$MANIFEST" | jq -r '.layers[] | "\(.size / 1024 / 1024 * 10 | floor / 10) MB  \(.digest[7:19])  \(.mediaType)"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build radarr-alpine
    if: github.event_name != 'workflow_dispatch' || !inputs.measure_baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve latest Radarr master version from GitHub Releases
        id: radarr_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Releases is the source of truth for Radarr master releases.
          # The latest release tag is always the current stable build.
          # Authenticated (GH_TOKEN) requests get the 5000/hr rate limit
          # instead of the 60/hr unauthenticated one, and we retry with
          # backoff in case of a transient failure or rate limit (radarr-alpine
          # hit an HTTP 522 from this same call pattern on prowlarr-alpine).
          VERSION=""
          for attempt in 1 2 3 4 5; do
            RESPONSE=$(curl -sSL -w '\n%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/Radarr/Radarr/releases/latest")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" = "200" ]; then
              VERSION=$(echo "$BODY" | jq -r '.tag_name | ltrimstr("v")')
              if [ -n "$VERSION" ] && [ "$VERSION" != "null" ]; then
                break
              fi
            fi
            echo "::warning::Attempt $attempt failed to resolve Radarr version (HTTP $HTTP_CODE). Retrying..."
            VERSION=""
            sleep $((attempt * 5))
          done
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve latest Radarr version from GitHub Releases after 5 attempts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Radarr master latest: $VERSION"

      - name: Determine tag suffix and latest-update flag
        id: variant
        run: |
          SUFFIX="${{ inputs.tag_suffix }}"
          # Tag scheme: pushes to main and scheduled runs publish :latest +
          # :<version>. workflow_dispatch with a tag_suffix publishes only
          # :<version>-<suffix> and does NOT touch :latest.
          #
          # is_default_branch guard: :latest is only ever updated when we're
          # actually building off the default branch. A workflow_dispatch run
          # against a feature branch with no tag_suffix used to fall through
          # to update_latest=true and clobber :latest — that's the CI hazard
          # this guard closes.
          IS_DEFAULT_BRANCH="false"
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            IS_DEFAULT_BRANCH="true"
          fi

          # For a pull_request event, github.ref_name is the synthetic merge
          # ref (e.g. "4/merge"), which contains a "/" and is not a valid
          # Docker tag component on its own. Use the PR number instead; for
          # any other non-default-branch event, fall back to the real branch
          # name (github.head_ref for pull_request, github.ref_name
          # otherwise) sanitized to tag-safe characters.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF_LABEL="pr-${{ github.event.number }}"
          else
            RAW_REF="${{ github.head_ref || github.ref_name }}"
            REF_LABEL=$(echo "$RAW_REF" | tr '/' '-' | tr -cd 'a-zA-Z0-9_.-')
          fi

          if [ -n "$SUFFIX" ]; then
            VERSION_TAG="${{ steps.radarr_version.outputs.version }}-${SUFFIX}"
            UPDATE_LATEST="false"
          elif [ "$IS_DEFAULT_BRANCH" = "true" ]; then
            VERSION_TAG="${{ steps.radarr_version.outputs.version }}"
            UPDATE_LATEST="true"
          else
            # No suffix given, but we're not on the default branch (e.g. a
            # manual dispatch against a feature branch, or a pull_request
            # build). Never touch :latest.
            VERSION_TAG="${{ steps.radarr_version.outputs.version }}-${REF_LABEL}"
            UPDATE_LATEST="false"
            echo "::warning::Non-default-branch build ('${{ github.event_name }}', ref '${{ github.ref_name }}') with no tag_suffix — tagging as '$VERSION_TAG' instead of touching :latest."
          fi

          # Periodic base refresh: the weekly Sunday cron forces a rebuild
          # even if this Radarr version was already published, so Alpine/apk
          # security patches land on a cadence rather than only on app
          # releases.
          FORCE_REBUILD="false"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "15 8 * * 0" ]; then
            FORCE_REBUILD="true"
          fi

          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "update_latest=$UPDATE_LATEST" >> "$GITHUB_OUTPUT"
          echo "force_rebuild=$FORCE_REBUILD" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists for this version
        id: check
        run: |
          TAG="${{ steps.variant.outputs.version_tag }}"
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull" | jq -r .token)
          HTTP=$(curl -sSL -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/$TAG")
          if [ "$HTTP" = "200" ] && [ "${{ steps.variant.outputs.force_rebuild }}" != "true" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $TAG already exists — skipping build."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            if [ "$HTTP" = "200" ]; then
              echo "::notice::Tag $TAG already exists but this is the periodic base-refresh run — rebuilding anyway."
            else
              echo "::notice::Tag $TAG not yet published (HTTP $HTTP) — will build."
            fi
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose docker tags
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.variant.outputs.version_tag }}"
          if [ "${{ steps.variant.outputs.update_latest }}" = "true" ]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags to push: $TAGS"

      - name: Set up Docker Buildx
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RADARR_VERSION=${{ steps.radarr_version.outputs.version }}
            RADARR_BRANCH=master
          cache-from: type=gha,scope=Dockerfile
          cache-to: type=gha,mode=max,scope=Dockerfile

      - name: Smoke test image (/ping)
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true')
        run: |
          # Boot the just-built/pushed image standalone and confirm it comes
          # up and answers /ping before we call the run green. Nothing in
          # this pipeline previously ran the image at all (cross-cutting CI
          # finding #5).
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.variant.outputs.version_tag }}"
          docker run -d --name radarr-smoke -p 7878:7878 "$IMAGE"

          READY=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "http://localhost:7878/ping" || true)
            if [ "$CODE" = "200" ]; then
              READY="1"
              break
            fi
            sleep 2
          done

          if [ -z "$READY" ]; then
            echo "::error::radarr-alpine smoke test failed — /ping never returned 200"
            docker logs radarr-smoke || true
            docker rm -f radarr-smoke || true
            exit 1
          fi

          echo "::notice::Smoke test passed — /ping returned 200"
          docker rm -f radarr-smoke

      - name: Report final image size
        if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true')
        run: |
          # Pull the just-pushed manifest and sum compressed layer sizes.
          # buildx with provenance attestations pushes an OCI image INDEX with
          # two entries: the amd64 image and a buildx provenance attestation
          # (platform=unknown/unknown). Resolve the index first to get the
          # real amd64 layer sizes.
          TAG="${{ steps.variant.outputs.version_tag }}"
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull" | jq -r .token)
          INDEX=$(curl -sSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/$TAG")
          MEDIA=$(echo "$INDEX" | jq -r '.mediaType // empty')
          if echo "$MEDIA" | grep -qE 'image\.index|manifest\.list'; then
            AMD64=$(echo "$INDEX" | jq -r '.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest' | head -1)
            MANIFEST=$(curl -sSL \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${{ github.repository }}/manifests/$AMD64")
          else
            MANIFEST="$INDEX"
          fi
          COMPRESSED=$(echo "$MANIFEST" | jq '[.layers[].size] | add')
          COMPRESSED_MB=$(echo "scale=1; $COMPRESSED / 1024 / 1024" | bc)
          LAYERS=$(echo "$MANIFEST" | jq '.layers | length')
          echo "::notice::radarr-alpine $TAG compressed = ${COMPRESSED_MB} MB across ${LAYERS} layers"
          echo "## Image Size" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compressed (linux/amd64): **${COMPRESSED_MB} MB** across ${LAYERS} layers" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Layer breakdown" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$MANIFEST" | jq -r '.layers[] | "\(.size / 1024 / 1024 * 10 | floor / 10) MB  \(.digest[7:19])"' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
